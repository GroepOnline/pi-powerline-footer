name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ponytail: Linux-only on push/PR; full OS matrix only on release tags.
        os: ${{ startsWith(github.ref, 'refs/tags/v') && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Circular dependency check
        run: npx madge --circular src index.ts bash-mode queue

  notify-linear-on-failure:
    name: Notify Linear on CI failure
    if: failure() && github.event_name != 'merge_group'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TITLE: "CI Failure: ${{ github.workflow }} in pi-wishcraft"
          RUN_URL: "https://github.com/GroepOnline/pi-wishcraft/actions/runs/${{ github.run_id }}"
        run: |
          curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            --data-raw '{
              "query": "mutation { issueCreate(input: { title: \"'"$TITLE"'\", description: \"Workflow **'"${{ github.workflow }}"'** failed in ['"pi-wishcraft'\"](https://github.com/GroepOnline/pi-wishcraft)\\n\\nRun: '\"\"$RUN_URL\"\"'\\nBranch: '\"${{ github.head_ref || github.ref_name }}\"'\\nSHA: '\"${{ github.sha.substring(0,7) }}\"'\\n\\nCreated automatically by CI failure tracker.\", teamId: \"bbd2b9e0-e644-4717-9074-8d0eaa3f150a\", priority: 2, labelIds: [\"713eee90-d169-40a6-98b8-7c71502b9855\"] }) { issue { id identifier } } }"
            }' | jq -r '.data.issueCreate.issue.identifier // "failed"'
